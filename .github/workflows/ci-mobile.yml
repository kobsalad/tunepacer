name: CI Mobile

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/src/main/assets/extensions/**'
      - 'gradle/**'
      - '*.kts'
      - '*.properties'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/src/main/assets/extensions/**'
      - 'gradle/**'
      - '*.kts'
      - '*.properties'
      - '.github/workflows/ci-mobile.yml'

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: app/src/main/assets/extensions/spotspeeder/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run check
        run: ./gradlew check
